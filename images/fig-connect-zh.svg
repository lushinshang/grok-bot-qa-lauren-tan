<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>bot 接進工作的各項功能與依據</title>
<desc>中間是 bot，連到七項功能，每項標示依據與影片時間。官方文件有：會議（Google Meet、Zoom、Teams，0:57）、信箱 mail.grokbot.com（7:50）、電話僅限美國（7:55）、Slack 與 Teams 團隊 bot（15:48）；合作方頁面有：Tailscale 私有網路（10:31）；文件有出入：Slack 裡 bot 互相交棒（16:12）；只有講者與媒體說：iMessage（15:11）。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
