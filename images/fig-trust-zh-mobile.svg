<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 720" width="480" height="720" role="img" font-family="PingFang TC, Noto Sans TC, Microsoft JhengHei, sans-serif">
<title>講者說法與官方文件對 Vault 的差異</title>
<desc>上方一個框：講者說，放得進密碼管理器的東西，都可以放心交給 bot（影片 1:04:34）。下方標題為官方文件怎麼寫，分左右兩欄：左欄 bot 看不到：已存的密碼、安全輸入表單的內容；右欄 bot 看得到：app 聊天中已存信用卡的卡號與安全碼、聯絡資料。底部兩條註記：Vault 全帳號共用，不能限定給某個 bot；不要把密碼、一次性驗證碼、API 金鑰貼進一般聊天。</desc>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#444"/></marker></defs>
<rect width="480" height="720" fill="#fbfaf7"/>
<rect x="20" y="20" width="440" height="100" rx="8" fill="#fff7ec" stroke="#d9822b" stroke-width="2.5"/>
<text x="36" y="44" font-size="13" fill="#555555" text-anchor="start">講者說</text>
<text x="444" y="44" font-size="12" fill="#555555" text-anchor="end">1:04:34</text>
<text x="240" y="76" font-size="17" fill="#222222" font-weight="bold" text-anchor="middle">放得進密碼管理器的東西，都可以放心交給 bot</text>
<path d="M240 122 L240 148" stroke="#444" stroke-width="2" fill="none" marker-end="url(#ah)"/>
<text x="240" y="172" font-size="15" fill="#555555" font-weight="bold" text-anchor="middle">官方文件怎麼寫</text>
<rect x="20" y="188" width="440" height="130" rx="8" fill="#ffffff" stroke="#4f8a5b" stroke-width="2.5"/>
<text x="240" y="220" font-size="18" fill="#4f8a5b" font-weight="bold" text-anchor="middle">bot 看不到</text>
<text x="240" y="258" font-size="16" fill="#222222" text-anchor="middle">已存的密碼</text>
<text x="240" y="292" font-size="16" fill="#222222" text-anchor="middle">安全輸入表單的內容</text>
<rect x="20" y="334" width="440" height="150" rx="8" fill="#ffffff" stroke="#d9822b" stroke-width="2.5"/>
<text x="240" y="366" font-size="18" fill="#d9822b" font-weight="bold" text-anchor="middle">bot 看得到</text>
<text x="240" y="404" font-size="16" fill="#222222" text-anchor="middle">app 聊天中已存信用卡的卡號與安全碼</text>
<text x="240" y="462" font-size="16" fill="#222222" text-anchor="middle">聯絡資料</text>
<rect x="20" y="502" width="440" height="90" rx="8" fill="#e8e8e4" stroke="#c9c8c0" stroke-width="1"/>
<text x="240" y="536" font-size="16" fill="#222222" text-anchor="middle">Vault 全帳號共用，不能限定給某個 bot</text>
<rect x="20" y="606" width="440" height="90" rx="8" fill="#e8e8e4" stroke="#c9c8c0" stroke-width="1"/>
<text x="240" y="640" font-size="16" fill="#222222" text-anchor="middle">不要把密碼、一次性驗證碼、API 金鑰貼進一般聊天</text>
</svg>
